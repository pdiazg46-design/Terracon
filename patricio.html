<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terracon — Carga Patricio Díaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131b2e;
            --bg-input: #0b1120;
            --border-color: rgba(255, 255, 255, 0.12);
            --solar-amber: #f59e0b;
            --solar-amber-glow: rgba(245, 158, 11, 0.2);
            --electric-cyan: #06b6d4;
            --electric-cyan-glow: rgba(6, 182, 212, 0.2);
            --success-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 12px; min-height: 100vh; }
        .app-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; width: 100%; }

        header {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px;
            display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 44px; height: 44px; background: linear-gradient(135deg, var(--solar-amber), #d97706);
            border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #000;
            box-shadow: 0 0 15px var(--solar-amber-glow);
        }
        .brand-text h1 { font-size: 16px; font-weight: 700; }
        .brand-text p { font-size: 11px; color: var(--electric-cyan); font-weight: 600; }

        .user-badge {
            background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--solar-amber);
            display: flex; align-items: center; justify-content: space-between;
        }

        .type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .type-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 6px;
            text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .type-card i { font-size: 20px; color: var(--text-muted); }
        .type-card span { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .type-card.active { background: rgba(6, 182, 212, 0.15); border-color: var(--electric-cyan); }
        .type-card.active i, .type-card.active span { color: var(--electric-cyan); }

        .form-section {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px;
            display: flex; flex-direction: column; gap: 12px; width: 100%;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-control {
            background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
            color: var(--text-main); font-size: 14.5px; font-family: inherit; outline: none; width: 100%;
        }

        .file-upload-zone {
            border: 2px dashed var(--border-color); border-radius: 12px; padding: 20px; text-align: center;
            background: rgba(0,0,0,0.25); cursor: pointer; width: 100%;
        }
        .file-upload-zone i { font-size: 28px; color: var(--solar-amber); margin-bottom: 6px; }
        .file-upload-zone p { font-size: 13px; color: var(--text-muted); }

        .btn-submit {
            background: linear-gradient(135deg, var(--solar-amber), #d97706); color: #000; border: none; padding: 16px;
            border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 8px; width: 100%; box-shadow: 0 4px 15px var(--solar-amber-glow);
        }

        .recent-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; }
        .recent-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .recent-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-user-gear"></i></div>
            <div class="brand-text">
                <h1>TERRACON CAPTURA</h1>
                <p>Perfil exclusivo: Patricio Díaz</p>
            </div>
        </div>
        <a href="reportes/dashboard_portafolio.html" style="color: var(--electric-cyan); font-weight: 600; text-decoration: none; font-size: 12px;">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
    </header>

    <!-- BADGE FIJO DE IDENTIDAD -->
    <div class="user-badge">
        <span>👨‍💼 CARGANDO COMO: <strong>PATRICIO DÍAZ</strong></span>
        <span style="font-size: 10px; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 6px;">DIRECTOR</span>
    </div>

    <!-- SELECTOR DE TIPO DE REGISTRO -->
    <div class="type-selector">
        <div class="type-card active" onclick="selectType('gasto', this)">
            <i class="fa-solid fa-receipt"></i>
            <span>Rendir Gasto</span>
        </div>
        <div class="type-card" onclick="selectType('reunion', this)">
            <i class="fa-solid fa-comments"></i>
            <span>Acta Reunión</span>
        </div>
        <div class="type-card" onclick="selectType('instruccion', this)">
            <i class="fa-solid fa-microphone"></i>
            <span>Nota de Voz</span>
        </div>
    </div>

    <div class="form-section">
        <!-- PROYECTO -->
        <div class="form-group">
            <label><i class="fa-solid fa-building-flag"></i> Seleccionar Proyecto</label>
            <select id="form-proyecto" class="form-control">
                <option value="Carrera Pinto (CC-CP-01)">⚡ Carrera Pinto (CC-CP-01)</option>
                <option value="Diego de Almagro (CC-DA-02)">🛠️ Diego de Almagro (CC-DA-02)</option>
            </select>
        </div>

        <div id="fields-gasto" style="display: flex; flex-direction: column; gap: 12px;">
            <div class="form-group">
                <label><i class="fa-solid fa-tags"></i> Categoría de Gasto</label>
                <select id="gasto-categoria" class="form-control">
                    <option value="CAT-04">Alojamiento / Casino</option>
                    <option value="CAT-02">Combustible / Vehículos</option>
                    <option value="CAT-03">Maquinaria / Camión Pluma</option>
                    <option value="CAT-01">Recursos Humanos / Bono</option>
                    <option value="CAT-05">Caja Chica / Consumibles</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-store"></i> Proveedor / Comercio</label>
                <input type="text" id="gasto-proveedor" class="form-control" placeholder="Ej: Copec S.A. / Hotel Atacama">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-file-invoice"></i> N° Boleta / Factura</label>
                <input type="text" id="gasto-doc" class="form-control" placeholder="Ej: F-1234">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-sack-dollar"></i> Monto Total ($ CLP)</label>
                <input type="number" id="gasto-monto" class="form-control" placeholder="45000" oninput="calcularImpuestos()">
            </div>
            <div style="font-size: 11px; color: var(--text-muted); display: flex; gap: 14px;" id="calc-preview">
                <span>Neto: $0</span><span>IVA (19%): $0</span>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-align-left"></i> Concepto del Gasto</label>
                <input type="text" id="gasto-concepto" class="form-control" placeholder="Ej: Combustible Camioneta Director">
            </div>
        </div>

        <div id="fields-reunion" style="display: none; flex-direction: column; gap: 12px;">
            <div class="form-group">
                <label><i class="fa-solid fa-heading"></i> Título de la Reunión</label>
                <input type="text" id="reunion-titulo" class="form-control" placeholder="Ej: Acuerdo Directivo Sonedix">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-list-check"></i> Compromisos Acordados</label>
                <textarea id="reunion-notas" class="form-control" rows="2" placeholder="Detalla los acuerdos..."></textarea>
            </div>
        </div>

        <div id="fields-instruccion" style="display: none; flex-direction: column; gap: 12px;">
            <div class="form-group">
                <label><i class="fa-solid fa-bullhorn"></i> Instrucción</label>
                <input type="text" id="instruccion-titulo" class="form-control" placeholder="Ej: Instrucción de avance">
            </div>
            <div class="form-group">
                <textarea id="instruccion-notas" class="form-control" rows="2" placeholder="Detalles de la instrucción..."></textarea>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-paperclip"></i> Adjuntar Boleta (Cámara / Foto)</label>
            <div class="file-upload-zone" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-camera"></i>
                <p id="upload-filename">📸 Toca para tomar foto a la boleta</p>
            </div>
            <input type="file" id="file-input" accept="image/*,application/pdf,audio/*" style="display: none;" onchange="handleFileSelect(this)">
        </div>

        <button class="btn-submit" onclick="guardarRegistroLocal()">
            <i class="fa-solid fa-paper-plane"></i> REGISTRAR COMO PATRICIO DÍAZ
        </button>
    </div>

    <div class="recent-section">
        <div class="recent-title">
            <span><i class="fa-solid fa-history"></i> Rendiciones de Patricio Díaz</span>
            <span style="font-size: 11px; color: var(--success-green);"><i class="fa-solid fa-circle"></i> Sincronizado</span>
        </div>
        <div class="recent-list" id="recent-list">
            <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 1rem;">Sin registros hoy.</div>
        </div>
    </div>
</div>

<script>
    let currentType = 'gasto';
    let selectedFile = null;
    let registrosLocales = [];
    const REPORTANTE = "Patricio Díaz";

    function selectType(type, element) {
        currentType = type;
        document.querySelectorAll('.type-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');

        document.getElementById('fields-gasto').style.display = type === 'gasto' ? 'flex' : 'none';
        document.getElementById('fields-reunion').style.display = type === 'reunion' ? 'flex' : 'none';
        document.getElementById('fields-instruccion').style.display = type === 'instruccion' ? 'flex' : 'none';
    }

    function calcularImpuestos() {
        const monto = parseFloat(document.getElementById('gasto-monto').value) || 0;
        const neto = Math.round(monto / 1.19);
        const iva = Math.round(monto - neto);
        document.getElementById('calc-preview').innerHTML = `<span>Neto: $${neto.toLocaleString('es-CL')}</span><span>IVA (19%): $${iva.toLocaleString('es-CL')}</span>`;
    }

    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            document.getElementById('upload-filename').innerText = `📎 ${selectedFile.name}`;
        }
    }

    function guardarRegistroLocal() {
        const proj = document.getElementById('form-proyecto').value;
        const fecha = new Date().toISOString().split('T')[0];
        let itemData = { fecha, reportante: REPORTANTE, proyecto: proj, tipo: currentType };

        if (currentType === 'gasto') {
            const proveedor = document.getElementById('gasto-proveedor').value || 'Proveedor Central';
            const doc = document.getElementById('gasto-doc').value || 'B-001';
            const monto = parseFloat(document.getElementById('gasto-monto').value) || 0;
            if (monto <= 0) { alert('⚠️ Ingresa el monto total.'); return; }
            itemData.titulo = `${proveedor} (${doc})`;
            itemData.sub = `$${monto.toLocaleString('es-CL')} CLP rendido por ${REPORTANTE}`;
        } else {
            itemData.titulo = document.getElementById('reunion-titulo').value || 'Registro de Patricio';
            itemData.sub = `Rendido por ${REPORTANTE}`;
        }

        registrosLocales.push(itemData);
        renderRecientes();
        alert(`✅ Registrado con éxito por ${REPORTANTE} para ${proj}.`);
    }

    function renderRecientes() {
        const list = document.getElementById('recent-list');
        list.innerHTML = '';
        registrosLocales.slice().reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'recent-item';
            div.innerHTML = `<div><strong>${item.titulo}</strong><div style="font-size: 11px; color: var(--text-muted);">${item.sub}</div></div><span>${item.fecha}</span>`;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
